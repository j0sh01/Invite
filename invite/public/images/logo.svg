<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="96" fill="#2563EB"/>
  
  <!-- Calendar body -->
  <rect x="96" y="144" width="320" height="280" rx="28" fill="white"/>
  
  <!-- Calendar top bar -->
  <rect x="96" y="144" width="320" height="64" rx="28" fill="#DBEAFE"/>
  <rect x="96" y="170" width="320" height="38" fill="#DBEAFE"/>
  
  <!-- Calendar dots -->
  <circle cx="152" cy="176" r="6" fill="#2563EB"/>
  <circle cx="200" cy="176" r="6" fill="#2563EB"/>
  <circle cx="248" cy="176" r="6" fill="#2563EB"/>
  
  <!-- Calendar date -->
  <text x="256" y="282" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="80" font-weight="700" fill="#1E293B">20</text>
  
  <!-- Calendar month -->
  <text x="256" y="330" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="500" fill="#64748B">JUL</text>
  
  <!-- Checkmark badge -->
  <circle cx="352" cy="360" r="44" fill="#10B981"/>
  <path d="M332 360l16 16 32-32" stroke="white" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- Invitation card accent line -->
  <line x1="140" y1="384" x2="240" y2="384" stroke="#E2E8F0" stroke-width="4" stroke-linecap="round"/>
  <line x1="140" y1="364" x2="200" y2="364" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round"/>
</svg>
